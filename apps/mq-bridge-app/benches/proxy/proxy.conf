worker_processes 2;
daemon off;
error_log stderr crit;
pid __BENCH_DIR__/proxy.pid;
events { worker_connections 8192; }
http {
    access_log off;
    client_body_temp_path __BENCH_DIR__/tmp;
    proxy_temp_path __BENCH_DIR__/tmp;
    fastcgi_temp_path __BENCH_DIR__/tmp;
    uwsgi_temp_path __BENCH_DIR__/tmp;
    scgi_temp_path __BENCH_DIR__/tmp;

    upstream prod    { server 127.0.0.1:9001; keepalive 128; }
    upstream staging { server 127.0.0.1:9002; keepalive 128; }

    map $host $unused { default 0; }

    server {
        listen 8080 reuseport backlog=4096;

        # plain proxy, no mirror
        location /plain {
            proxy_pass http://prod;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # the config under comparison
        location /test {
            mirror /mirror;
            mirror_request_body on;
            proxy_pass http://prod;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location = /mirror {
            internal;
            proxy_pass http://staging;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    server {
        listen 8443 ssl reuseport backlog=4096;
        ssl_certificate     __BENCH_DIR__/cert.pem;
        ssl_certificate_key __BENCH_DIR__/key.pem;
        ssl_session_cache shared:SSL:10m;

        location /plain {
            proxy_pass http://prod;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location /test {
            mirror /mirror;
            mirror_request_body on;
            proxy_pass http://prod;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location = /mirror {
            internal;
            proxy_pass http://staging;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
