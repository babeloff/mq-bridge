worker_processes 1;
daemon off;
error_log stderr crit;
pid __BENCH_DIR__/upstream.pid;
events { worker_connections 8192; }
http {
    access_log off;
    client_body_temp_path __BENCH_DIR__/tmp;
    proxy_temp_path __BENCH_DIR__/tmp;
    fastcgi_temp_path __BENCH_DIR__/tmp;
    uwsgi_temp_path __BENCH_DIR__/tmp;
    scgi_temp_path __BENCH_DIR__/tmp;
    server {
        listen 9001 reuseport backlog=4096;
        location / { return 200 'prod-ok'; }
    }
    server {
        listen 9002 reuseport backlog=4096;
        access_log __BENCH_DIR__/logs/staging-access.log combined;
        location / { return 200 'staging-ok'; }
    }
}
