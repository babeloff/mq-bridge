# pixi workspace for the mq-bridge engine crate.
#
# Purpose: every native library the crate needs comes from conda-forge instead of
# being vendored, bundled or cmake-built by a `-sys` crate. That means one solved,
# locked toolchain (`pixi.lock`) reproduces the build on every platform, and the
# long librdkafka/SQLite/protobuf source compiles disappear from `cargo build`.
#
# Enter the environment with `pixi shell`, or run a single task with
# `pixi run <task>`. See the "Building with pixi" section of CONTRIBUTING.md.

[workspace]
name = "mq-bridge"
version = "0.4.12"
description = "An asynchronous message bridging library connecting Kafka, MQTT, AMQP, NATS, MongoDB, HTTP, and more."
authors = ["Marco Mengelkoch"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/marcomq/mq-bridge"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
# Native libraries and tools the build needs from conda-forge rather than from a
# vendored copy inside a -sys crate:
#
#   librdkafka  used by the `link-dynamic` variant (rdkafka/dynamic-linking).
#               The `link-static` variant builds librdkafka itself, so this is
#               only needed for `build-dynamic` and the CI sweep.
#   libprotobuf ships bin/protoc, needed by EVERY variant's `grpc` feature
#               (replaces the protoc-bin-vendored build-dependency).
#   zeromq      libzmq peers for the interop tests and the zmq.rs comparison
#               bench. The zeromq endpoint itself is pure-Rust zmq.rs and links
#               nothing, so this is test scaffolding, not a build dependency.
#
# rdkafka-sys 4.10 pkg-config-probes `rdkafka >= 2.12.1`.
librdkafka = ">=2.12.1,<3"
# No libsqlite: SQLite is bundled by the sqlx dependency in Cargo.toml, so
# neither variant links a shared one. It was here when `link-dynamic` selected
# sqlx's `sqlite-unbundled`; it no longer does.
zeromq = ">=4.3.5,<5"
# protoc lives in libprotobuf on conda-forge; the `protobuf` package is the
# Python runtime and is not what tonic-prost-build needs.
libprotobuf = ">=5"

# Build glue. pkg-config is how rdkafka-sys locates librdkafka above;
# conda-forge's build bakes the environment prefix into its default search
# path, so no PKG_CONFIG_PATH is needed.
pkg-config = ">=0.29"
# aws-lc-sys / ring / zstd-sys still compile C, and aws-lc-sys drives cmake.
# These pin the compiler instead of taking whatever the host happens to have.
c-compiler = ">=1.11"
cxx-compiler = ">=1.11"
cmake = ">=3.31"
# Task scripts with real control flow live in scripts/pixi/*.nu rather than as
# multi-line `cmd` strings; nushell runs them identically on win-64, which a
# bash snippet would not.
nushell = ">=0.100"
# Supply-chain and integration gates, previously only reachable through the
# task runner this branch replaces.
cargo-deny = ">=0.16"
cargo-nextest = ">=0.9"
# No libclang either: `sqlite-unbundled` was the only bindgen in the tree, and
# it is gone with it.

[target.unix.dependencies]
# cmake's default generator on unix.
make = ">=4.3"

# The toolchain is a separate feature so the `native` environment can leave it
# out: the beta row of .github/workflows/test-matrix.yml brings its own rustup
# toolchain and only needs the native libraries from here.
[feature.toolchain.dependencies]
# `full` reaches omq-tokio, whose MSRV is 1.93; the base crate is 1.85.
# conda-forge ships one stable `rust`; there is no beta channel.
rust = ">=1.93,<2"

# Release chores only, so nodejs stays out of the environments CI builds and
# tests in. scripts/sync-version.mjs is the single implementation of the
# version fan-out; it is also driven by npm scripts from node/mq-bridge-node
# and apps/mq-bridge-app, so it is not pixi-specific.
[feature.release.dependencies]
nodejs = ">=20"

[feature.dev.dependencies]
# Integration suites are archived and filtered with nextest in CI.
cargo-nextest = ">=0.9"
# `pixi run -e dev test-integration` drives the compose stacks under
# tests/integration/docker-compose/.
docker-compose = ">=2.30"
# src/endpoints/grpc/tests.rs shells out to `python3 -m grpc_tools.protoc` for
# the wire-compatibility test (it skips itself if the import fails).
python = ">=3.12,<3.14"
grpcio-tools = ">=1.60"
# The py-* tasks build and test the extension with this environment's own
# interpreter, so maturin and pytest come from here rather than from uv.
maturin = ">=1.7,<2"
pytest = ">=8"

# --- Environments -------------------------------------------------------------

[environments.default]
features = ["toolchain"]
solve-group = "default"

[environments.dev]
features = ["toolchain", "dev"]
solve-group = "default"

# Native libraries only, no Rust. For a build that supplies its own toolchain.
[environments.native]
solve-group = "default"

[environments.release]
features = ["release"]
solve-group = "default"

# --- Environment wiring -------------------------------------------------------
#
# Only what cargo cannot work out for itself. Everything else already resolves
# through the environment: protoc via PATH, the Windows DLLs via PATH, and the
# .pc files via pkg-config's baked-in prefix.
#
# There is deliberately no [target.win-64.activation.env]: pixi emits these
# values verbatim into a shell-specific export, so a `$CONDA_PREFIX`
# interpolation has no spelling that works in both cmd.exe and PowerShell.
# Windows needs none of it -- protoc.exe and the DLLs are found on PATH.

[target.unix.activation.env]
# No LIBCLANG_PATH / BINDGEN_EXTRA_CLANG_ARGS: nothing in the tree runs bindgen
# any more.
#
# prost-build would also find `protoc` on PATH; set explicitly so a build
# script cannot silently pick up a different one.
PROTOC = "$CONDA_PREFIX/bin/protoc"
# Records an rpath so a dynamically linked binary finds librdkafka without
# LD_LIBRARY_PATH, which conda does not set. That matters for
# `./target/release/...` and for the prebuilt nextest archive CI passes between
# jobs.
#
# Measured caveat: on linux-64 the conda toolchain adds this same rpath at link
# time on its own, so this line is belt-and-braces there and shows up as a
# duplicated DT_RPATH entry. It is kept because that behaviour is a property of
# conda's compiler rather than something guaranteed across the platforms in
# `platforms` above, and a missing rpath fails at runtime rather than at build.
RUSTFLAGS = "-C link-arg=-Wl,-rpath,$CONDA_PREFIX/lib"

# --- Tasks --------------------------------------------------------------------

[tasks.build]
cmd = "cargo build"
description = "Build with default features"

[tasks.build-full]
cmd = "cargo build --features full"
description = "Build every endpoint and middleware"

# --- Release build variants ---------------------------------------------------
#
# Three ways to obtain the C libraries; see the "three build variants" comment
# in Cargo.toml. All three take the toolchain, cmake, the C compiler and protoc
# from this environment -- they differ only in librdkafka.
#
# Verified on linux-64 by readelf on target/release/mq_bridge_http_profile:
#   build-static   DT_NEEDED = ld-linux, libc, libdl, libgcc_s, libm, libpthread
#   build-dynamic  the same, plus librdkafka.so.1
#
# Note the static variants are self-contained but not fully relocatable: the
# conda toolchain records an rpath into $CONDA_PREFIX/lib whatever RUSTFLAGS
# says, and only libgcc_s could ever resolve from there. It falls through to
# the system loader path on a machine without the environment, so it is
# hygiene rather than a functional problem; strip it with
# `patchelf --remove-rpath` if a released artifact must carry no build paths.

# Nothing links out to a C library that has to be installed alongside the
# binary -- except the IBM MQ client, which is loaded lazily at runtime only if
# an ibm-mq endpoint is actually used.
[tasks.build-static]
cmd = "cargo build --release --features full"
description = "Self-contained C libs; IBM MQ resolved at runtime via dlopen"

# Links this environment's librdkafka. What a conda-forge recipe
# or a distro package wants, so the shared libraries stay patchable.
[tasks.build-dynamic]
cmd = "cargo build --release --features full-dynamic"
description = "Link librdkafka from the environment (conda-forge packaging)"

[tasks.build-portable]
cmd = "cargo build --features portable"
description = "Build the feature set that needs no native library from the environment"

[tasks.build-release]
cmd = "cargo build --release --features full"
description = "Release build, full features"

[tasks.fmt]
cmd = "cargo fmt --all"
description = "Format the workspace"

[tasks.fmt-check]
cmd = "cargo fmt --all -- --check"
description = "Fail on unformatted code"

[tasks.clippy]
cmd = "cargo clippy --all-targets --features lint-all -- -D warnings"
description = "Lint as CI does"

[tasks.check-features]
cmd = "nu scripts/pixi/check-features.nu"
description = "cargo check each feature subset CI covers, reporting every failure"

[tasks.test]
cmd = "cargo test --lib --features full"
description = "Unit tests, full features"

[tasks.test-no-docker]
cmd = "cargo test --test ref_test --test sqlite_test --test tls_example --test websocket_test --features full"
description = "Integration tests that need no Docker services"

[tasks.test-memory-leak]
cmd = "cargo test --test memory_leak_test --features full -- --ignored --nocapture"
description = "Route commit-task JoinSet leak soak"

[tasks.check-config-compat]
cmd = "cargo check -p grpc-config-compat"
description = "Downstream GrpcConfig literal fixture (not a default member)"

[tasks.doc]
cmd = "cargo doc --no-deps --features full"
description = "Build rustdoc"

[tasks.verify-native-deps]
cmd = "nu scripts/pixi/verify-native-deps.nu"
description = "Show which native libraries resolved, and from where"

[feature.dev.tasks.test-integration]
cmd = "cargo nextest run --release --features full,test-utils --test integration_test --test armature_integration"
description = "Full Docker-backed integration suite (needs a running Docker daemon)"

[feature.dev.tasks.bench]
cmd = "cargo bench --features test-utils"
description = "Criterion benchmarks"

# Run as `pixi run -e release bump-version 0.4.11`. Everything downstream of the
# root [workspace.package] version is rewritten from it: pixi.toml, both
# Cargo.toml/Cargo.lock pairs, server.json, tauri.conf.json and the Node
# package/lock. pixi.lock needs no update -- it records no workspace version.
[feature.release.tasks.bump-version]
cmd = "node scripts/sync-version.mjs"
description = "Set the version everywhere (pass the new version, or none to re-sync)"

[feature.release.tasks.check-version]
cmd = "node scripts/sync-version.mjs --check"
description = "Fail if any committed copy of the version has drifted"

# --- Gates the replaced task runner carried ---------------------------------

# Everything ci.yml gates a PR on, bar the Docker-backed suites.
[tasks.ci]
depends-on = ["fmt-check", "clippy", "check-config-compat", "check-features", "test", "test-no-docker", "doc"]
description = "Run every PR gate except the Docker suites"

[tasks.deny]
cmd = "cargo deny check bans licenses sources"
description = "Licenses, bans and sources (a hard gate in CI)"

# Informational in CI: every current advisory is in a transitive dependency we
# cannot upgrade ourselves. deny.toml carries the reasoning.
[tasks.deny-advisories]
cmd = "cargo deny check advisories"
description = "RustSec advisories (informational)"

[tasks.node-check]
cmd = 'cargo check -p mq-bridge-node --no-default-features --features "http middleware schema"'
description = "cargo check the node bindings as node.yml does"

# --- Docker-backed integration ----------------------------------------------
#
# Compiled once into an archive, as ci.yml does, so the filtered runs need no
# recompilation.

[feature.dev.tasks.integration-archive]
cmd = """
cargo nextest archive --release --features full,test-utils   --test integration_test --test armature_integration   --archive-file nextest-archive.tar.zst"""
description = "Build the nextest archive for the Docker suites"

# Narrow with a nextest filter, e.g.
#   pixi run -e dev integration 'binary(integration_test) & test(=test_all_status)'
[feature.dev.tasks.integration]
args = [{ arg = "filter", default = "all()" }]
cmd = """
cargo nextest run --archive-file nextest-archive.tar.zst   --run-ignored all --no-capture -E '{{ filter }}'"""
depends-on = ["integration-certs"]
description = "Run the Docker suites from the archive; takes a nextest filter"

[feature.dev.tasks.integration-certs]
cmd = "nu scripts/pixi/integration-certs.nu"
description = "Generate the TLS fixtures the integration services need"

# --- Python bindings --------------------------------------------------------
#
# These use this environment's own python and maturin rather than uv. The
# replaced task runner had to unset CONDA_PREFIX to stop maturin refusing when
# it and VIRTUAL_ENV were both set; here there is only one interpreter and pixi
# owns it, so that whole failure mode is gone.

[feature.dev.tasks.py-dev]
cmd = "maturin develop --manifest-path python/mq-bridge-py/Cargo.toml"
description = "Build the extension into this environment"

[feature.dev.tasks.py-test]
cmd = "pytest -q"
cwd = "python/mq-bridge-py"
depends-on = ["py-dev"]
description = "Run the Python test suite"

# python.yml's regression check that the lean, no-default build still exposes
# the always-on public API.
[feature.dev.tasks.py-test-lean]
cmd = """
cargo test -p mq-bridge-py --no-default-features --features http,rustls-ring test_config_schema_is_always_available && cargo test -p mq-bridge-py --no-default-features --features http,rustls-ring test_module_init_installs_rustls_provider"""
description = "Lean no-default-features regression tests"

# --- Application (separate cargo workspace) ---------------------------------
#
# apps/mq-bridge-app has its own Cargo.lock, so these run from inside it.

[tasks.app-check]
cmd = "cargo check -p mq-bridge-app-core -p mq-bridge-app --all-targets"
cwd = "apps/mq-bridge-app"
description = "cargo check the app crates"

[tasks.app-lint]
cmd = "cargo clippy -p mq-bridge-app-core -p mq-bridge-app --all-targets -- -D warnings"
cwd = "apps/mq-bridge-app"
description = "Clippy the app crates, warnings denied"

[tasks.app-test]
cmd = "cargo test -p mq-bridge-app-core -p mq-bridge-app --lib --bins"
cwd = "apps/mq-bridge-app"
description = "Unit and bin tests for the app crates"

[tasks.app-ci]
depends-on = ["app-check", "app-lint", "app-test"]
description = "Everything app.yml gates the app crates on"

# Reaches the engine's `link-dynamic` through the passthroughs in crates/core
# and crates/cli. `--no-default-features` is required: `default = ["full"]`
# would otherwise be on too and collide with it.
[tasks.app-build-dynamic]
cmd = "cargo build --release -p mq-bridge-app --no-default-features --features full-dynamic"
cwd = "apps/mq-bridge-app"
description = "The app, linked against this environment's librdkafka"
