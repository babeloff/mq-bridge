listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
# autosave_interval is a change-count here (autosave_on_changes true), and each
# save rewrites the whole DB -- so a per-message value makes broker cost scale
# with the stored backlog. Once the chaos restart leaves a few thousand queued
# messages the broker never drains them and the test times out. The publisher
# confirms every QoS 1/2 message against its PUBACK and the restart is a
# graceful SIGTERM (mosquitto writes the DB on shutdown), so a coarse interval
# loses nothing.
autosave_on_changes true
autosave_interval 1000
max_queued_messages 50000
# Allow a large QoS 1/2 inflight window. The default (20) is far smaller than
# the client's configured max_inflight (1000), so the broker would advertise a
# Receive Maximum of 20 and reject every excess QoS-2 PUBLISH with a PUBREC
# reason of QuotaExceeded (0x97) -- silently dropping almost all messages.
# 0 = unlimited.
max_inflight_messages 0