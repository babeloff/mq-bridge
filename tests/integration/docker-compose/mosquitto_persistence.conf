listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
# Persist after every single change rather than on a lazy timer.
# With autosave_on_changes true, autosave_interval is a change-count, so
# autosave_interval 1 writes the DB after each message. This closes the
# window where a message is PUBACKed to the publisher but not yet on disk,
# which is what the chaos test (hard broker restart) otherwise exposes.
autosave_on_changes true
autosave_interval 1
max_queued_messages 50000
# Allow a large QoS 1/2 inflight window. The default (20) is far smaller than
# the client's configured max_inflight (1000), so the broker would advertise a
# Receive Maximum of 20 and reject every excess QoS-2 PUBLISH with a PUBREC
# reason of QuotaExceeded (0x97) -- silently dropping almost all messages.
# 0 = unlimited.
max_inflight_messages 0