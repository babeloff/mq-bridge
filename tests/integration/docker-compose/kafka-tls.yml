services:
  kafka:
    image: confluentinc/cp-kafka:7.9.5
    container_name: kafka-itest-mq-bridge-tls
    ports:
      - "9093:9093"
    volumes:
      - ./kafka-certs:/etc/kafka/secrets:ro
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      CLUSTER_ID: 'ci-cluster-id-for-mq-bridge-12345'

      # Listeners: expose SSL listener
      KAFKA_LISTENERS: 'SSL://:9093,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'SSL://localhost:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'SSL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'

      # SSL settings (keystore/truststore mounted into container)
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka.keystore.jks
      KAFKA_SSL_KEYSTORE_PASSWORD: changeit
      KAFKA_SSL_KEY_PASSWORD: changeit
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka.truststore.jks
      KAFKA_SSL_TRUSTSTORE_PASSWORD: changeit

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:9093 1 30 && kafka-topics --bootstrap-server localhost:9093 --list"]
      interval: 10s
      timeout: 20s
      retries: 5