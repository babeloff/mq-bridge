services:
  mariadb:
    image: mariadb:11
    container_name: mariadb-itest-mq-bridge
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=testdb
      - MYSQL_USER=testuser
      - MYSQL_PASSWORD=testpass
      - MYSQL_PWD=testpass
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u testuser"]
      interval: 5s
      timeout: 10s
      retries: 20
