# TechEmpower benchmark entry for mq-bridge (Rust).
#
# Uses a path dependency on the local mq-bridge checkout so it builds straight
# from this repo (`cargo build --release` in this directory). The empty
# `[workspace]` table decouples it from the parent workspace.
#
# For the upstream FrameworkBenchmarks PR, replace the path dependency with a
# pinned git/crates.io release, e.g.
#   mq-bridge = { git = "https://github.com/marcomq/mq-bridge", tag = "v0.2.18", default-features = false, features = ["http"] }
[package]
name = "mq-bridge-techempower"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "mq-bridge-techempower"
path = "src/main.rs"

[dependencies]
mq-bridge = { path = "../../../..", default-features = false, features = ["http"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
fastrand = "2"
# DB tests (/db, /queries). Same major as the mq-bridge sqlx endpoint.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[workspace]
