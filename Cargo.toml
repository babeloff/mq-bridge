[package]
name = "mq-bridge"
version.workspace = true
edition = "2021"
authors = ["Marco Mengelkoch"]
rust-version = "1.75"  # Base crate MSRV; optional amqp needs Rust 1.88, http needs Rust 1.85.
description = "An asynchronous message bridging library connecting Kafka, MQTT, AMQP, NATS, MongoDB, HTTP, and more."
repository = "https://github.com/marcomq/mq-bridge"
license = "MIT"
readme = "README.md"
keywords = ["messaging", "kafka", "nats", "amqp", "cqrs"]
categories = ["asynchronous", "network-programming"]

[workspace]
members = ["python/mq-bridge-py", "node/mq-bridge-node"]
resolver = "2"

[workspace.package]
version = "0.2.20"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1"
fast-uuid-v7 = "0.1.5"
serde = "1.0"
serde_json = "1.0"
serde_yaml_ng = "0.10"
tokio = "1.34"  # `Receiver::recv_many` (HTTP source batch drain) needs 1.34+.
tracing = "0.1"

[profile.release]
lto = "thin"
strip = "symbols"

[[bin]]
name = "mq_bridge_http_profile"
path = "scripts/analysis/http/mq_bridge_http_profile.rs"
required-features = ["http"]

[dependencies]

serde = { workspace = true, features = ["derive"] }
anyhow.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "signal"] }
# Note on MSRV for optional features:
# The base crate keeps MSRV 1.75 with default = [].
# - "amqp" (lapin 4.10) requires Rust 1.88+; "http" (hyper-rustls 0.27) requires Rust 1.85+.
# - "websocket" (tokio-websockets 0.13) requires Rust 1.89+.
# - "aws" (aws-sdk-*) may require a newer stable toolchain than the base MSRV.
# Use `rustup override set stable` or a `rust-toolchain.toml` file when enabling these features.
async-trait.workspace = true
serde_json.workspace = true
thiserror = "2.0"
futures = "0.3"
tracing.workspace = true
bytes = { workspace = true, features = ["serde"] }
async-channel = { version = "2.5" }
once_cell = { version = "1.21" }
uuid = { version = "1.23" }
fast-uuid-v7.workspace = true
rmp-serde = "1.3"

# Common TLS dependencies.
# `default-features = false` strips rustls' default `aws_lc_rs` crypto provider;
# the provider is selected explicitly via the `rustls-ring` / `rustls-aws-lc`
# features below. This is what lets the `basic`/ring build contain NO aws-lc-sys
# (BoringSSL C), so it cross-compiles cleanly for aarch64/armv7.
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["tls12", "logging"] }
rustls-pemfile = { version = "2.2", optional = true }
webpki-roots = { version = "1", optional = true }

# Metrics
metrics = { version = "0.24", optional = true }

# Storage for Deduplication
sled = { version = "0.34", optional = true }

# Gen IDs
rand = { version = "0.10" }

# Test Utils
tracing-appender = { version = "0.2", optional = true }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"], optional = true }

# --- Optional Endpoint Dependencies ---

# Kafka
rdkafka = { version = "0.39", features = ["tokio"], optional = true }

# AMQP (RabbitMQ).
# Drop lapin's defaults so the crypto provider remains wired through
# `rustls-ring` / `rustls-aws-lc` below.
lapin = { version = "4.10", default-features = false, features = ["tokio", "rustls"], optional = true }

# MongoDB
mongodb = { version = "3.6", optional = true, features = ["cert-key-password"] }

# NATS
async-nats = { version = "0.49", optional = true }

# MQTT.
# `use-rustls-no-provider` pulls tokio-rustls without a crypto provider (its
# default would enable aws_lc_rs); the provider follows `tokio-rustls?/ring`
# or `tokio-rustls?/aws_lc_rs` from the crypto features below.
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"], optional = true }

# IBM MQ
mqi = { version = "0.3", optional = true }

# HTTP
arc-swap = { version = "1", optional = true }
hyper = { version = "1.8", optional = true, features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", optional = true, features = ["tokio", "client", "client-legacy", "server", "http1", "http2"] }
hyper-rustls = { version = "0.27", optional = true, default-features = false, features = ["http1", "http2", "tls12", "logging", "native-tokio"] }
http-body-util = { version = "0.1", optional = true }
http-body = { version = "1.0", optional = true }
h2 = { version = "0.4", optional = true }
flate2 = { version = "1.0", optional = true }
base64 = { version = "0.22", optional = true }
tokio-websockets = { version = "0.13", optional = true, default-features = false, features = ["client", "server", "sha1_smol", "fastrand"] }

# AWS
aws-config = { version = "1.8", optional = true, default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-sdk-sqs = { version = "1.92", optional = true, default-features = false, features = ["rt-tokio", "rustls"] }
aws-sdk-sns = { version = "1.93", optional = true, default-features = false, features = ["rt-tokio", "rustls"] }

# SQLx
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "any"], optional = true }

# ZeroMQ
zeromq = { version = "0.6", optional = true }

# gRPC
tonic = { version = "0.14", optional = true, default-features = false, features = ["codegen", "transport", "tls-webpki-roots"] }
tonic-prost = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true, default-features = false, features = ["std", "derive"] }
tokio-stream = { version = "0.1", optional = true, features = ["net"] }

url = { version = "2.5", optional = true }

# Generate JSON schema
schemars = { version = "1.2", optional = true }

# test-utils
serde_yaml_ng = { workspace = true, optional = true }


[build-dependencies]
tonic-prost-build = { version = "0.14", optional = true, default-features = false, features = ["transport"] }
protoc-bin-vendored = { version = "3.0", optional = true }

[features]
default = []
middleware = ["metrics", "dedup"]
full = ["middleware", "mongodb", "kafka", "amqp", "nats", "mqtt", "http", "aws", "zeromq", "sled", "grpc", "sqlx", "websocket", "rustls-aws-lc"]

# Functionality features
dedup = ["sled"]
metrics = ["dep:metrics"]
test-utils = ["dep:tracing-appender", "dep:tracing-subscriber", "dep:serde_yaml_ng"]

# TLS crypto provider selection — pick exactly one when using any TLS endpoint
# (http, grpc, mqtt, nats, amqp, …).  If neither is enabled the application binary
# must call `rustls::crypto::CryptoProvider::install_default()` before building
# any TLS endpoint.  This follows the same pattern as reqwest / hyper-rustls.
rustls-ring    = ["rustls/ring",       "tokio-rustls?/ring",       "hyper-rustls?/ring",       "lapin?/rustls--ring",      "lapin?/rustls-native-certs"]
# `prefer-post-quantum` (X25519MLKEM768) is aws-lc-rs only — `ring` cannot do PQ —
# so it lives here, not on `rustls-ring`. It was part of rustls' default features
# that `default-features = false` above strips, so we re-add it explicitly.
rustls-aws-lc  = ["rustls/aws_lc_rs",  "rustls/prefer-post-quantum", "tokio-rustls?/aws_lc_rs",  "hyper-rustls?/aws-lc-rs",  "lapin?/rustls--aws_lc_rs", "lapin?/rustls-native-certs"]

# Generate Schema file
schema = ["dep:schemars"]

# Endpoint features
kafka = ["rdkafka"]
amqp = ["lapin", "rustls", "rustls-pemfile", "url"]
nats = ["async-nats", "rustls", "rustls-pemfile"]
mongodb = ["dep:mongodb"]
mqtt = ["rumqttc", "rustls", "tokio-rustls", "rustls-pemfile", "url"]
http = ["dep:arc-swap", "hyper", "hyper-util", "hyper-rustls", "http-body-util", "dep:http-body", "rustls", "tokio-rustls", "rustls-pemfile", "webpki-roots", "h2", "dep:flate2", "dep:base64"]
websocket = ["dep:tokio-websockets"]
aws = ["aws-config", "aws-sdk-sqs", "aws-sdk-sns", "dep:base64"]
ibm-mq = ["mqi"]
zeromq = ["dep:zeromq"]
# Note: The grpc feature requires protobuf-src which can significantly increase build times.
grpc = ["tonic", "prost", "tokio-stream", "tonic-prost", "tonic-prost-build", "protoc-bin-vendored", "rustls"]
sqlx = ["dep:sqlx", "url"]

[dev-dependencies]
config = { version = "0.15" }
serde_yaml_ng = "0.10"
tempfile = "3.10"
chrono = "0.4"
metrics-util = "0.20"
criterion = { version = "0.8", features = ["async", "async_tokio"] }
# Used by the router_bench microbench to model the proposed lock-free route table.
arc-swap = "1"
mq-bridge = { path = ".", features = ["test-utils", "rustls-ring"] }
reqwest = { version = "0.13", features = ["stream"] }

# TLS test helpers
rcgen = "0.14"
tokio-rustls = { version = "0.26", features = ["ring"] }
rustls = { version = "0.23", features = ["ring"] }

[[bench]]
name = "performance_bench"
harness = false
required-features = ["test-utils"]

# Isolates the per-request HTTP route lookup (Mutex<HashMap> vs ArcSwap).
# No external services or features required.
[[bench]]
name = "router_bench"
harness = false

[[test]]
name = "integration_test"
required-features = ["test-utils"]

[target.'cfg(windows)'.dependencies.rdkafka]
version = "0.39"
features = ["cmake-build", "tokio"]
optional = true
