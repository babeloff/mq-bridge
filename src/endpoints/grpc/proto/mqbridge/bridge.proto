syntax = "proto3";

package mqbridge;

// Stable public interoperability API for mq-bridge.
//
// Compatibility policy:
// - field numbers and enum values are never reused;
// - removed fields and enum values are reserved;
// - only backward-compatible additions are made in this package;
// - breaking changes use a new package (mqbridge.v2), leaving this one in place.
service Bridge {
    rpc Publish (BridgeMessage) returns (PublishResponse);
    rpc PublishBatch (stream BridgeMessage) returns (stream PublishResponse);
    rpc Subscribe (SubscribeRequest) returns (stream BridgeMessage);
    rpc Acknowledge (Ack) returns (AckResponse);
}

message BridgeMessage {
    bytes payload = 1;
    string id = 2;
    map<string, string> metadata = 3;
}

message PublishResponse {
    reserved 1, 2, 3;

    oneof result {
        BridgeMessage reply = 10;
        Ack ack = 11;
        string error = 12;
    }
}

message Ack {
    string id = 1;

    enum Status {
        ACK = 0;
        NACK = 1;
        REQUEUE = 2;
    }

    Status status = 2;
    string reason = 3;
    map<string, string> metadata = 4;
}

message AckResponse {
    bool success = 1;
    string error = 2;
}

message SubscribeRequest {
    string topic = 1;
    // Stable for the lifetime of a consumer, including reconnects. Servers use
    // it to retain and redeliver messages that have not been acknowledged yet.
    string consumer_id = 2;
}
