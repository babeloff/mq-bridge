name: CI

on:
  pull_request:
    branches: [main, dev]
    # The app lives in the same repo but cannot affect the engine crate. Its own
    # checks run in app.yml, which conversely *does* trigger on engine changes.
    paths-ignore:
      - 'apps/mq-bridge-app/**'
      - '.github/workflows/app.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Only the tip of a PR branch is worth testing; superseded runs are cancelled so
# they stop holding runner slots the integration jobs are waiting for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing in CI writes back to the repository; artifacts move through the Actions
# runtime token, not this one.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Linting and formatting checks
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Supplies the Rust toolchain (with rustfmt and clippy) *and* the native
      # libraries the feature-gated endpoints link: librdkafka for `kafka`,
      # libsqlite for `sqlx`, protoc for `grpc`. `activate-environment` exports
      # pixi's activation into $GITHUB_ENV, so the plain `cargo` steps below —
      # and Swatinem/rust-cache, which shells out to rustc — see them.
      - name: Set up pixi environment
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          environments: default
          activate-environment: true
          cache: true

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check
      
      # Not --all-features: that enables link-static and link-dynamic together,
      # which src/lib.rs rejects. `lint-all` is the aggregate of every
      # code-gating feature; linkage features gate no code.
      - name: Run clippy
        run: cargo clippy --all-targets --features lint-all -- -D warnings

      # Not a workspace default member, so nothing else builds it. It pins the
      # exhaustive `GrpcConfig` literal a downstream crate would write.
      - name: Check downstream config-compat fixture
        run: cargo check -p grpc-config-compat

  # Every feature subset still gets its own `cargo check`, but sequentially in one
  # job: the matrix cost 8 runner slots at the moment integration-build's dependents
  # were starving, and none of this is on the critical path.
  build:
    name: Build (feature subsets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pixi environment
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          environments: default
          activate-environment: true
          cache: true

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # amqp/aws/zeromq are omitted: unchanged for a while and covered by `full`.
      # `full` is the static-linkage variant, so `full-dynamic` is swept too —
      # it is the only subset that exercises the pkg-config paths into
      # conda-forge's librdkafka and libsqlite, and nothing else here would
      # catch those breaking.
      - name: Check each feature subset
        run: |
          failed=""
          for f in "" full full-dynamic kafka nats grpc mqtt mongodb http; do
            echo "::group::cargo check --features ${f:-<default>}"
            if [ -z "$f" ]; then
              cargo check --all-targets || failed="$failed <default>"
            else
              cargo check --all-targets --features "$f" || failed="$failed $f"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::feature subsets failed:$failed"
            exit 1
          fi

  # Unit tests
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The `dev` environment adds python + grpcio-tools on top of the toolchain
      # and native libraries, which is what src/endpoints/grpc/tests.rs shells
      # out to for the Python gRPC compatibility test (it skips itself if the
      # import fails). No setup-python and no PEP-668 workaround needed.
      - name: Set up pixi environment
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          environments: dev
          activate-environment: dev
          cache: true

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --lib --features=full
# currently - just random panic test
#      - name: Run long-running unit tests
#        run: cargo test --lib --features=full -- --ignored --nocapture

      - name: Run non-Docker integration tests
        run: cargo test --test ref_test --test sqlite_test --test tls_example --test websocket_test --features=full

      - name: Memory leak soak (route commit-task JoinSet)
        run: cargo test --test memory_leak_test --features=full -- --ignored --nocapture

  # Compile the integration test binaries ONCE (release, full,test-utils) and
  # publish them as a nextest archive. The three run jobs below download this
  # archive instead of each recompiling the same binaries.
  integration-build:
    name: Integration — Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `dev` also carries cargo-nextest, so the archive is built with the same
      # nextest the run jobs below use.
      - name: Set up pixi environment
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          environments: dev
          activate-environment: dev
          cache: true

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with the benchmark job so the full-feature dependency compile
          # is reused across jobs/runs.
          shared-key: release-full

      - name: Build nextest archive
        run: |
          cargo nextest archive \
            --release --features full,test-utils \
            --test integration_test --test armature_integration \
            --archive-file nextest-archive.tar.zst

      - name: Upload nextest archive
        uses: actions/upload-artifact@v7
        with:
          name: integration-nextest-archive
          path: nextest-archive.tar.zst
          retention-days: 1

  # Integration tests (requires Docker), split across runners by measured runtime
  # so no single job dominates the critical path. Each runs the prebuilt nextest
  # archive from integration-build — no recompilation. `--no-capture` implies
  # `--test-threads=1`, and tests tear their compose stacks down with `down -v`,
  # so parallelism has to come from separate runners rather than from nextest.
  integration:
    name: Integration — ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: integration-build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Status
            filter: 'binary(integration_test) & test(=test_all_status)'
          - name: Chaos
            filter: 'binary(integration_test) & test(=test_all_chaos)'
          - name: Logic
            filter: 'binary(integration_test) & (test(=test_all_request_reply) | test(=test_all_subscriber_logic))'
          - name: Endpoints
            filter: 'binary(integration_test) & not test(=test_all_status) & not test(=test_all_chaos) & not test(=test_all_request_reply) & not test(=test_all_subscriber_logic) & not test(=test_all_performance_pipeline) & not test(=test_all_performance_direct)'
          - name: Performance Pipeline
            filter: 'binary(integration_test) & test(=test_all_performance_pipeline)'
          - name: Performance Direct
            filter: 'binary(integration_test) & test(=test_all_performance_direct)'
    services:
      docker:
        image: docker:dind
        options: --privileged
    steps:
      - uses: actions/checkout@v7

      # Not just for nextest: the archived binaries are dynamically linked
      # against librdkafka/libsqlite in the pixi env, with an rpath recorded at
      # build time. That rpath is <checkout>/.pixi/envs/dev/lib, which resolves
      # here because the checkout path is the same on every runner — so the
      # environment has to be restored before the archive can run.
      - name: Set up pixi environment
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          environments: dev
          activate-environment: dev
          cache: true

      - name: Download nextest archive
        uses: actions/download-artifact@v8
        with:
          name: integration-nextest-archive

      - name: Pre-pull docker images
        run: |
          find tests/integration/docker-compose -name "*.yml" | xargs -P 5 -I {} docker compose -f {} pull -q

      - name: Install JRE (for keytool)
        timeout-minutes: 5
        run: |
          # Runner images ship a JDK; only pay the 46 MB download if they didn't.
          # A degraded apt mirror used to stall this step for hours.
          if command -v keytool >/dev/null 2>&1; then exit 0; fi
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
            default-jre-headless

      - name: Generate TLS certs for integration services
        run: |
          chmod +x tests/integration/scripts/gen_certs.sh
          ./tests/integration/scripts/gen_certs.sh mongodb
          ./tests/integration/scripts/gen_certs.sh kafka
          ./tests/integration/scripts/gen_certs.sh ibm-mq

      - name: Run ${{ matrix.name }} integration tests
        run: |
          cargo nextest run --archive-file nextest-archive.tar.zst \
            --run-ignored all --no-capture \
            -E '${{ matrix.filter }}'

  # Armature clones an external repo and runs its test suite: no docker stacks, no
  # TLS certs, no keytool. It used to pay ~1.3m of setup for 1.7m of tests.
  integration-armature:
    name: Integration — Armature
    runs-on: ubuntu-latest
    needs: integration-build
    steps:
      - uses: actions/checkout@v7

      # Same reason as the integration job above: nextest plus the runtime
      # libraries the archived binaries were linked against.
      - name: Set up pixi environment
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          environments: dev
          activate-environment: dev
          cache: true

      - name: Download nextest archive
        uses: actions/download-artifact@v8
        with:
          name: integration-nextest-archive

      - name: Run armature integration tests
        run: |
          cargo nextest run --archive-file nextest-archive.tar.zst \
            --run-ignored all --no-capture \
            -E 'binary(armature_integration)'

  # Documentation
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # --all-features reaches grpc and sqlx, so rustdoc needs protoc and
      # libsqlite just as much as a build does.
      - name: Set up pixi environment
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          environments: default
          activate-environment: true
          cache: true

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build documentation (deny warnings)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --features lint-all --no-deps

  # Supply chain: licenses, banned crates, source registries, RustSec advisories
  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Hard gate: an unapproved license, a banned crate or a non-crates.io
      # source is always a real, actionable problem in this repo.
      - name: Licenses / bans / sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

      # Informational: every current advisory is in a transitive dependency we
      # cannot upgrade ourselves, and RustSec updates daily. SECURITY.md records
      # the per-feature reachability analysis; deny.toml carries the reasoning.
      - name: Advisories (informational)
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
