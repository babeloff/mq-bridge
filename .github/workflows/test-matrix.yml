name: Test Matrix

on:
  push:
    branches: [main, dev]
    # The app lives in the same repo but cannot affect the engine crate. Its own
    # checks run in app.yml, which conversely *does* trigger on engine changes.
    paths-ignore:
      - 'apps/mq-bridge-app/**'
      - '.github/workflows/app.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main, dev]
    # The app lives in the same repo but cannot affect the engine crate. Its own
    # checks run in app.yml, which conversely *does* trigger on engine changes.
    paths-ignore:
      - 'apps/mq-bridge-app/**'
      - '.github/workflows/app.yml'
      - '.github/workflows/docs.yml'

# Superseded PR runs are cancelled; push runs always finish so every pre-merge
# commit keeps its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test-matrix:
    name: Test on ${{ matrix.os }} with Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest/stable is omitted: ci.yml's `Test` job already runs
        # `cargo test --lib --features=full` there on every PR, and the beta
        # entry below keeps Linux covered on push.
        os: [macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: beta
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing in this job writes back to the repository.
          persist-credentials: false
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ matrix.rust }}
      
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      
      - name: Run tests
        run: cargo test --lib --features=full
      
      - name: Check build
        run: cargo build --features=full
